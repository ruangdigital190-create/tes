.panel.admin-login{border:1px solid var(--line);border-radius:25px;background:linear-gradient(145deg,#18263e,#0e1728);box-shadow:0 25px 80px rgba(0,0,0,.3);padding:clamp(24px,4vw,37px)}
.panel.admin-login h1{font-family:'Space Grotesk',sans-serif;letter-spacing:-1px;font-size:clamp(27px,5vw,35px)}

.panel.admin-login .field{font-weight:800}
.panel.admin-login input{min-height:49px}
.panel.admin-login .btn{min-height:46px}

body{background:radial-gradient(ellipse at 8% -10%,rgba(91,104,255,.18),transparent 36rem),radial-gradient(ellipse at 100% 5%,rgba(62,210,205,.09),transparent 32rem),#080e1b;font-family:'DM Sans',system-ui,sans-serif}
.top{background:rgba(9,17,32,.90);border-color:rgba(185,207,239,.12)}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>

// SATU-SATUNYA BAGIAN WAJIB DIISI: Project URL dan public/anon key Supabase.
// Isi dua nilai ini secara sama pada index.html, admin.html, reset.html.
// JANGAN letakkan password admin, service_role key, atau password database di sini.
const CONFIG = window.RD_CONFIG || {
  supabaseUrl: "PASTE_PROJECT_URL_HERE",
  supabaseAnonKey: "PASTE_PUBLIC_ANON_KEY_HERE",
  whatsappNumber: "6285725423328",
  storeName: "RUANGDIGITAL190"
};


const $ = (id) => document.getElementById(id);
const fmt = (v) => v === null || v === undefined ? 'Konfirmasi admin' : 'Rp' + Number(v).toLocaleString('id-ID');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const validUrl = (value) => {
  if (!value) return '';
  try { const u = new URL(value, location.href); return ['http:', 'https:'].includes(u.protocol) ? u.href : ''; }
  catch { return ''; }
};
const isConfigured = Boolean(/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(CONFIG.supabaseUrl) && CONFIG.supabaseAnonKey && !CONFIG.supabaseAnonKey.startsWith('PASTE_'));
let instance = null;
function getDb() {
  if (!isConfigured) return null;
  if (!instance) {
    if (!window.supabase?.createClient) throw new Error('Supabase SDK gagal dimuat. Periksa koneksi internet / CDN.');
    instance = window.supabase.createClient(CONFIG.supabaseUrl.replace(/\/$/,''), CONFIG.supabaseAnonKey, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}});
  }
  return instance;
}
function toast(message) {
  const el = $('toast'); if(!el) return;
  el.textContent = message; el.classList.remove('hidden');
  clearTimeout(el._hideTimeout); el._hideTimeout = setTimeout(() => el.classList.add('hidden'), 4600);
}
function showModal(id) {const el=$(id);if(!el)return;el.classList.remove('hidden');el.setAttribute('aria-hidden','false');document.body.classList.add('lock');}
function closeModal(id) {const el=$(id);if(!el)return;el.classList.add('hidden');el.setAttribute('aria-hidden','true');if(!document.querySelector('.modal:not(.hidden)'))document.body.classList.remove('lock');}
function dateText(value) {return value ? new Date(value).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'}) : '—';}
function safeError(error) {return (error && typeof error.message === 'string') ? error.message : 'Terjadi kesalahan. Periksa koneksi dan pengaturan Supabase.';}
function currentDevice() {
 const ua=navigator.userAgent || '';
 const os=/Android/i.test(ua)?'Android':/iPhone|iPad/i.test(ua)?'iPhone/iPad':/Windows/i.test(ua)?'Windows':/Macintosh/i.test(ua)?'Mac':'Perangkat lain';
 const browser=/Edg\//.test(ua)?'Edge':/Firefox\//.test(ua)?'Firefox':/Chrome\//.test(ua)?'Chrome':/Safari\//.test(ua)?'Safari':'Browser';
 return os+' • '+browser;
}
let heartbeat = null, deviceId = null, trackedUser = null;
async function startDeviceTracking(db,userId) {
 if(!db||!userId)return;
 if(trackedUser === userId && heartbeat)return;
 stopDeviceTracking(); trackedUser=userId; deviceId=crypto.randomUUID();
 const push=async()=>{
  try{await db.from('device_sessions').upsert({id:deviceId,user_id:userId,device_label:currentDevice(),last_seen:new Date().toISOString(),is_active:true},{onConflict:'id'});}catch(e){console.warn('device heartbeat:',safeError(e));}
 };
 await push(); heartbeat=setInterval(push,60000);
}
function stopDeviceTracking() {
 if(heartbeat) clearInterval(heartbeat);
 heartbeat=null;trackedUser=null;
}
async function markDeviceInactive(db) {
 if(db && deviceId)try {await db.from('device_sessions').update({is_active:false,last_seen:new Date().toISOString()}).eq('id',deviceId);}catch{}
 stopDeviceTracking();deviceId=null;
}


let db=null, recoveryVerified=false;
try {db=getDb();$('resetMessage').textContent=db?'Memeriksa token pemulihan email autentikasi…':'Supabase belum dikonfigurasi. Isi CONFIG di reset.html.';}catch(e){$('resetMessage').textContent=safeError(e);}
if(db){
 db.auth.onAuthStateChange((event,session)=>{
  if(event==='PASSWORD_RECOVERY'){
    recoveryVerified=true;
    $('resetMessage').textContent='Tautan pemulihan terverifikasi. Masukkan password baru.';
  }
 });
 // Detect recovery tokens from the URL only; a plain logged-in session is insufficient.
 const fragment=new URLSearchParams(location.hash.replace(/^#/,''));
 const query=new URLSearchParams(location.search);
 if (query.get('token_hash') && query.get('type')==='recovery') {
   db.auth.verifyOtp({token_hash:query.get('token_hash'),type:'recovery'}).then(({error})=>{
     if(error){$('resetMessage').textContent='Tautan reset tidak valid: '+safeError(error);}
     else {recoveryVerified=true;$('resetMessage').textContent='Tautan pemulihan terverifikasi. Masukkan password baru.';}
   });
 }
}
$('resetForm').onsubmit=async(e)=>{e.preventDefault();if(!db)return;const password=$('newPassword').value;
 if(!recoveryVerified){$('resetMessage').textContent='Buka halaman ini melalui tautan pemulihan email yang valid. Akun username-only tanpa email autentikasi tidak dapat melakukan reset melalui email.';return;}
 const {data:{session},error:sessionError}=await db.auth.getSession();if(sessionError||!session){$('resetMessage').textContent='Sesi pemulihan tidak valid atau kedaluwarsa. Ulangi permintaan reset dari halaman login.';return;}
 const {error}=await db.auth.updateUser({password});$('resetMessage').textContent=error?'Gagal mengganti password: '+safeError(error):'Password berhasil diperbarui. Silakan kembali ke toko dan login.';
};
